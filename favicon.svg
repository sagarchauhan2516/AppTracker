<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#radarBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Radar Wave Rings -->
  <circle cx="32" cy="36" r="22" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>
  <circle cx="32" cy="36" r="15" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.45"/>
  <circle cx="32" cy="36" r="8" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.7"/>

  <!-- Radar Dish / Emitter -->
  <path d="M 22 46 L 32 36 L 42 46" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Glowing Pulse Center -->
  <circle cx="32" cy="36" r="3.5" fill="#38bdf8"/>
  <circle cx="32" cy="36" r="1.5" fill="#ffffff"/>

  <!-- Satellite Signal Target Ping -->
  <circle cx="44" cy="22" r="3" fill="#34d399"/>
  <circle cx="44" cy="22" r="6" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
</svg>
